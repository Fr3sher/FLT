<!doctype html>
<!-- App is dark-only: data-theme is hard-coded on <html> (no inline script,
     so there's no CSP 'script-src' violation, and zero FOUC before first paint). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E" />
    <title>FLT - Fresh LoRa Trainer</title>
    <meta name="description" content="Build, caption, and curate LoRA training datasets — generation, face scoring, masking, and ai-toolkit training in one workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#09090b;color:#a1a1aa;font-family:Inter,system-ui,sans-serif;z-index:9999}
      /* GPU-composited spinner (translateZ) so it keeps turning even while the
         main thread parses the large JS bundle on a slow link. */
      #boot-spinner{width:44px;height:44px;border-radius:50%;border:4px solid #27272a;border-top-color:#818cf8;animation:bootspin .8s linear infinite;will-change:transform;transform:translateZ(0)}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      /* Indeterminate "it's working" bar — no JS, pure CSS, survives the slow
         boot. The indicator sweeps left-to-right across the track. */
      #boot-track{position:relative;width:min(240px,70vw);height:3px;border-radius:9999px;background:#27272a;overflow:hidden}
      #boot-bar{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:9999px;background:#6366f1;animation:bootbar 1.25s ease-in-out infinite;will-change:transform;transform:translateZ(0)}
      @keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    </style>

    <script type="module" crossorigin src="/assets/index-DlvYnq9w.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-DEX5tgmF.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BuylvHub.css">
  </head>
  <body class="font-[Inter]">
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div id="boot-spinner" aria-hidden="true"></div>
        <div id="boot-track" aria-hidden="true"><div id="boot-bar"></div></div>
        <p style="font-size:14px;margin:0">Loading FLT…</p>
      </div>
    </div>
  </body>
</html>
