<!doctype html>
<!-- App is dark-only: data-theme is hard-coded on <html> (no inline script,
     so there's no CSP 'script-src' violation, and zero FOUC before first paint). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E" />
    <title>FLT - Fresh LoRa Trainer</title>
    <meta name="description" content="Build, caption, and curate LoRA training datasets — generation, face scoring, masking, and ai-toolkit training in one workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#09090b;color:#a1a1aa;font-family:Inter,system-ui,sans-serif;z-index:9999}
      /* GPU-composited spinner (translateZ) so it keeps turning even while the
         main thread parses the large JS bundle on a slow link. */
      /* Two-tone ring + glow so rotation is unmistakable; JS (requestAnimationFrame)
         drives the spin so it turns even under prefers-reduced-motion. */
      #boot-spinner{width:48px;height:48px;border-radius:50%;border:5px solid #1e293b;border-top-color:#818cf8;border-right-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,.35);will-change:transform}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      /* Progress track. Indeterminate sweep until real download progress is known,
         then .boot-determinate switches to an honest, width-driven fill. */
      #boot-track{position:relative;width:min(260px,74vw);height:3px;border-radius:9999px;background:#27272a;overflow:hidden}
      #boot-bar{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:9999px;background:#6366f1;animation:bootbar 1.25s ease-in-out infinite;will-change:transform;transform:translateZ(0)}
      #boot-bar.boot-determinate{animation:none;width:0;transition:width .35s ease;will-change:width;transform:none}
      @keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
      #boot-label{font-size:14px;margin:0}
      #boot-pct{font-variant-numeric:tabular-nums;color:#818cf8;min-width:2.4em;display:inline-block;text-align:right}
    </style>

    <script type="module" crossorigin src="/assets/index-BySKkOuj.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-DEX5tgmF.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BSB2niNf.css">
  </head>
  <body class="font-[Inter]">
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div id="boot-spinner" aria-hidden="true"></div>
        <div id="boot-track"><div id="boot-bar"></div></div>
        <p id="boot-label">Loading FLT… <span id="boot-pct" aria-hidden="true"></span></p>
      </div>
    </div>
    <script>
      /* Drive the boot spinner with requestAnimationFrame so it always turns,
         even under prefers-reduced-motion or if CSS animations are disabled.
         A loading indicator must show life. Stops once React replaces the splash. */
      (function () {
        var sp = document.getElementById('boot-spinner');
        if (!sp) return;
        var t0 = null;
        function spin(t) {
          if (!document.getElementById('boot-splash')) return;
          if (t0 === null) t0 = t;
          var deg = ((t - t0) * 0.36) % 360; // 360deg/s ≈ 1 full turn per second
          sp.style.transform = 'rotate(' + deg + 'deg)';
          requestAnimationFrame(spin);
        }
        requestAnimationFrame(spin);
      })();
    </script>
    <script>
      /* Real boot progress: fill the bar as the page's actual critical assets
         (CSS, module script, modulepreloads) finish downloading, read from
         Resource Timing. Every increment is a resource that truly completed —
         no fake timer. Capped at 90%: the last 10% is React mounting, which
         replaces this splash. Kept as one small inline script (no CSP blocks
         it here) and guarded so it's a no-op if it ever can't run. */
      (function () {
        var bar = document.getElementById('boot-bar');
        var pctEl = document.getElementById('boot-pct');
        if (!bar || !pctEl) return;

        // The critical resources this document depends on (same-origin assets).
        var critical = [];
        function add(url) {
          if (url && critical.indexOf(url) === -1) critical.push(url);
        }
        var links = document.querySelectorAll(
          'link[rel="stylesheet"][href], link[rel="modulepreload"][href]');
        for (var i = 0; i < links.length; i++) add(links[i].href);
        var scripts = document.querySelectorAll('script[src]');
        for (var j = 0; j < scripts.length; j++) add(scripts[j].src);
        if (critical.length === 0) return; // nothing to measure — stay indeterminate

        var done = {};
        var started = false;

        function paint() {
          var n = 0;
          for (var k = 0; k < critical.length; k++) if (done[critical[k]]) n++;
          var pct = Math.min(90, Math.round((n / critical.length) * 100));
          if (!started) {
            started = true;
            bar.className = 'boot-determinate';
          }
          bar.style.width = pct + '%';
          pctEl.textContent = pct + '%';
        }

        function mark(url) {
          if (done[url] || critical.indexOf(url) === -1) return;
          done[url] = true;
          paint();
        }

        // Mark a stylesheet/module script done on its load (or error) event.
        function watch(el) {
          if (!el || !el.href) return;
          el.addEventListener('load', function () { mark(el.href); }, { once: true });
          el.addEventListener('error', function () { mark(el.href); }, { once: true });
        }
        for (var a = 0; a < links.length; a++) watch(links[a]);
        for (var b = 0; b < scripts.length; b++) watch(scripts[b]);

        // Poll Resource Timing as a backstop for modulepreloads (which don't
        // fire load events) and for resources already cached before this ran.
        var timer = null;
        function poll() {
          try {
            var res = performance.getEntriesByType('resource');
            for (var m = 0; m < res.length; m++) {
              var e = res[m];
              if (e && e.transferSize > 0) mark(e.name);
            }
          } catch (err) {}
          var allDone = true;
          for (var c = 0; c < critical.length; c++) if (!done[critical[c]]) { allDone = false; break; }
          if (allDone || !document.getElementById('boot-splash')) return; // stop
          timer = setTimeout(poll, 150);
        }
        timer = setTimeout(poll, 300);
      })();
    </script>
  </body>
</html>
